[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gumroad-downloader"
version = "0.1.0"
description = "Download every file of a Gumroad purchase from a /d/ link, including video products"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Dimitar Dimitrov", email = "eggressive@users.noreply.github.com" }]
keywords = ["gumroad", "downloader", "cli", "hls", "ffmpeg"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6"]

[project.scripts]
gumroad-dl = "gumroad_dl.cli:main"

[project.urls]
Homepage = "https://github.com/eggressive/gumroad-downloader"

[tool.hatch.build.targets.wheel]
packages = ["src/gumroad_dl"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
